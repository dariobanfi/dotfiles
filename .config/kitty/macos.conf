# macOS-only settings and keys, loaded by kitty.conf. Keep the keys in step with linux.conf:
# Cmd here = Ctrl+Shift there, Cmd+Shift here = Ctrl+Shift+Alt there.

shell /bin/zsh --login
hide_window_decorations titlebar-only
macos_option_as_alt left
macos_show_window_title_in none
# Quit when the last window closes, so every reopen is a fresh launch that gets centered
macos_quit_when_last_window_closed yes

# Kitty maps Cmd+M to minimize by itself, before macOS sees it. Unmap it so
# the Shortcuts "open kitty" hotkey isn't swallowed.
map cmd+m

# Cmd+click opens links even when a TUI (e.g. Claude Code) has grabbed the mouse
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

# Splits (iTerm-style)
map cmd+d       split_right
map shift+cmd+d split_down
map cmd+enter   split_right
map cmd+[       previous_window
map cmd+]       next_window
# Cmd+W closes the focused split (and the tab once it's the last one)
map cmd+w       close_window
# Cmd+Opt+arrows belongs to Rectangle
map cmd+shift+left  neighboring_window left
map cmd+shift+right neighboring_window right
map cmd+shift+up    neighboring_window up
map cmd+shift+down  neighboring_window down
map cmd+shift+enter zoom_split

# Copying (replaces the default Cmd+F search in less; that one is still on Ctrl+Shift+/)
map cmd+f       copy_mode
map cmd+shift+c copy_last_output
map cmd+shift+l copy_line
map cmd+shift+p copy_path

# Sessions
map cmd+o       pick_session
map cmd+shift+s save_session

# Cmd+number jumps to the tab with that number (kitty's default is the Nth split)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Jump to the previous / next prompt in the scrollback
map cmd+up   scroll_to_prompt -1
map cmd+down scroll_to_prompt 1
