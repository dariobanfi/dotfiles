# Linux-only keys, loaded by kitty.conf. Keep them in step with macos.conf:
# Cmd there = Ctrl+Shift here, Cmd+Shift there = Ctrl+Shift+Alt here.
# (Cmd would be the Super key, which most Linux desktops keep for themselves.)
#
# Already right by default: Ctrl+Shift+[ and ] move between splits, Ctrl+Shift+W closes one,
# Ctrl+Shift+click opens links even when a TUI has grabbed the mouse.

# Splits
map ctrl+shift+d     split_right
map ctrl+shift+alt+d split_down
map ctrl+shift+alt+left  neighboring_window left
map ctrl+shift+alt+right neighboring_window right
map ctrl+shift+alt+up    neighboring_window up
map ctrl+shift+alt+down  neighboring_window down
map ctrl+shift+alt+enter zoom_split

# Copying (Ctrl+Shift+C stays kitty's plain "copy selection")
map ctrl+shift+f     copy_mode
map ctrl+shift+alt+c copy_last_output
map ctrl+shift+alt+l copy_line
map ctrl+shift+alt+p copy_path

# Sessions (replaces the default Ctrl+Shift+O, pass selection to a program)
map ctrl+shift+o     pick_session
map ctrl+shift+alt+s save_session

# Ctrl+Shift+number jumps to the tab with that number (kitty's default is the Nth split)
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

# Jump to the previous / next prompt in the scrollback
map ctrl+shift+up   scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1
